<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Simple Budget Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ===== RESET & ROOT ===== */
*, *::before, *::after {
  margin: 0; padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
–h: 844px; /* iPhone 14 height */

/* Balletcore Cloud - Blue Edition */
–bg:        #F8FBFE;
–surface:   #ffffff;
–surface2:  #EEF6FB;
–border:    #C8DFF0;
–primary:   #A8D4E6;
–primary-d: #4A8CAA;
–accent:    #D9A5B3;
–accent-s:  #F5E8ED;
–text1:     #1a2e38;
–text2:     #4a6878;
–text3:     #8aaabb;
–shadow:    0 2px 20px rgba(168,212,230,0.18);

/* Spacing / sizing */
–nav-h:    72px;
–header-h: 72px;
–radius:   25px;
–radius-s: 16px;
}

@media (prefers-color-scheme: dark) {
:root {
–bg:        #0d1e28;
–surface:   #142030;
–surface2:  #1a2d3d;
–border:    #1e3a4d;
–primary:   #7abdd6;
–primary-d: #a8d4e6;
–accent:    #3d2030;
–accent-s:  #2a1a22;
–text1:     #e8f4f9;
–text2:     #8ab8cc;
–text3:     #4a7080;
–shadow:    0 2px 16px rgba(0,0,0,0.3);
}
}

html, body {
width: 100%; height: 100%;
overflow: hidden;
background: var(–bg);
color: var(–text1);
font-family: ‘Noto Sans JP’, sans-serif;
font-weight: 300;
-webkit-font-smoothing: antialiased;
}

/* ===== APP SHELL ===== */
#app {
max-width: 480px;
width: 100%;
height: 100dvh;
margin: 0 auto;
display: flex;
flex-direction: column;
}

/* ===== SCREENS ===== */
.screen {
display: none;
flex-direction: column;
flex: 1;
overflow: hidden;
height: calc(100dvh - var(–nav-h));
}
.screen.active { display: flex; }

/* ===== HEADER ===== */
.screen-header {
padding: 16px 24px 10px;
flex-shrink: 0;
}
.screen-header .eyebrow {
font-family: ‘Cormorant Garamond’, serif;
font-size: 11px;
letter-spacing: 0.28em;
color: var(–primary);
text-transform: uppercase;
margin-bottom: 2px;
}
.screen-header h1 {
font-family: ‘Cormorant Garamond’, serif;
font-size: 22px;
font-weight: 300;
font-style: italic;
color: var(–text1);
letter-spacing: 0.03em;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
height: var(–nav-h);
background: rgba(255,255,255,0.75);
backdrop-filter: blur(15px);
-webkit-backdrop-filter: blur(15px);
border-top: 0.5px solid var(–border);
display: flex;
flex-shrink: 0;
padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 4px;
border: none;
background: none;
cursor: pointer;
min-height: 44px;
color: var(–text3);
transition: color 0.15s;
}
.nav-btn.active { color: var(–primary-d); }
.nav-btn .nav-icon { font-size: 20px; line-height: 1; }
.nav-btn .nav-label {
font-size: 10px;
letter-spacing: 0.1em;
font-weight: 300;
}
.nav-btn.active .nav-label { color: var(–primary-d); }

/* ===== FAB (ナビ内中央) ===== */
.fab {
width: 54px; height: 54px;
border-radius: 50%;
background: linear-gradient(145deg, var(–primary), var(–primary-d));
border: none;
color: #fff;
font-size: 26px;
line-height: 1;
cursor: pointer;
box-shadow: 0 4px 20px rgba(74,140,170,0.35);
display: flex;
align-items: center;
justify-content: center;
transition: transform 0.15s;
flex-shrink: 0;
margin-top: -20px;
}
.fab:active { transform: scale(0.92); }

/* ===== SCREEN: HOME ===== */
#screen-home .content {
flex: 1;
display: flex;
flex-direction: column;
gap: 8px;
padding: 0 16px 12px;
overflow: hidden;
}

/* メインバランスカード */
.balance-card {
background: var(–surface);
border-radius: var(–radius);
padding: 12px 16px 10px;
box-shadow: var(–shadow);
flex-shrink: 0;
}
.balance-card .lbl {
font-size: 10px;
letter-spacing: 0.15em;
color: var(–text3);
margin-bottom: 2px;
}
.balance-card .amount {
font-family: ‘Cormorant Garamond’, serif;
font-size: 34px;
font-weight: 300;
color: var(–primary-d);
line-height: 1;
letter-spacing: -0.01em;
}
.balance-card .amount .unit {
font-size: 16px;
color: var(–primary);
margin-right: 2px;
vertical-align: 0.15em;
}
.balance-card .sub {
font-size: 10px;
color: var(–text3);
margin-top: 4px;
}
.progress-track {
height: 4px;
background: var(–surface2);
border-radius: 99px;
margin-top: 6px;
overflow: hidden;
}
.progress-fill {
height: 100%;
background: linear-gradient(90deg, var(–primary), var(–primary-d));
border-radius: 99px;
transition: width 0.6s ease;
}
.progress-row {
display: flex;
justify-content: space-between;
margin-top: 5px;
font-size: 10px;
color: var(–text3);
}

/* 2カラムスタット */
.stats-row {
display: flex;
gap: 10px;
flex-shrink: 0;
}
.stat-card {
flex: 1;
background: var(–surface);
border-radius: var(–radius-s);
padding: 8px 12px;
box-shadow: var(–shadow);
}
.stat-card .lbl {
font-size: 10px;
letter-spacing: 0.12em;
color: var(–text3);
margin-bottom: 2px;
}
.stat-card .amount {
font-family: ‘Cormorant Garamond’, serif;
font-size: 22px;
font-weight: 300;
color: var(–text1);
line-height: 1;
}
.stat-card .amount .unit { font-size: 12px; color: var(–text3); }

/* カテゴリ一覧 */
.cat-section {
flex: 1;
background: var(–surface);
border-radius: var(–radius);
box-shadow: var(–shadow);
overflow: hidden;
display: flex;
flex-direction: column;
min-height: 0;
}
.cat-section .sec-title {
font-size: 10px;
letter-spacing: 0.2em;
color: var(–text3);
padding: 8px 16px 6px;
border-bottom: 1px solid var(–border);
flex-shrink: 0;
}
.cat-rows {
flex: 1;
overflow: hidden;
display: flex;
flex-direction: column;
justify-content: space-around;
padding: 2px 0;
}
.cat-row {
display: flex;
align-items: center;
gap: 10px;
padding: 4px 16px;
}
.cat-emoji { font-size: 18px; width: 26px; text-align: center; flex-shrink: 0; }
.cat-name { font-size: 12px; color: var(–text2); flex: 1; font-weight: 300; }
.cat-bar-wrap {
width: 52px; height: 4px;
background: var(–surface2);
border-radius: 99px;
overflow: hidden;
}
.cat-bar {
height: 100%;
background: linear-gradient(90deg, var(–border), var(–primary));
border-radius: 99px;
}
.cat-amt {
font-family: ‘Cormorant Garamond’, serif;
font-size: 16px;
font-weight: 300;
color: var(–text2);
min-width: 64px;
text-align: right;
}

/* NMD バー */
.nmd-bar {
background: linear-gradient(135deg, var(–accent), var(–surface2));
border-radius: var(–radius-s);
padding: 8px 14px;
display: flex;
align-items: center;
gap: 12px;
flex-shrink: 0;
}
.nmd-bar .nmd-icon { font-size: 20px; }
.nmd-bar .nmd-text .lbl { font-size: 10px; letter-spacing: 0.12em; color: var(–text3); }
.nmd-bar .nmd-text .val {
font-family: ‘Cormorant Garamond’, serif;
font-size: 18px;
font-weight: 300;
color: var(–text1);
line-height: 1.1;
}
.nmd-bar .nmd-text .val span { font-size: 11px; color: var(–text3); font-family: ‘Noto Sans JP’, sans-serif; }
.nmd-bar .nmd-msg {
margin-left: auto;
font-size: 11px;
color: var(–primary);
font-style: italic;
font-family: ‘Cormorant Garamond’, serif;
text-align: right;
line-height: 1.3;
}

/* ===== SCREEN: HISTORY ===== */
#screen-history .content {
flex: 1;
display: flex;
flex-direction: column;
padding: 0 16px 16px;
overflow: hidden;
gap: 10px;
}
.history-wrap {
flex: 1;
background: var(–surface);
border-radius: var(–radius);
box-shadow: var(–shadow);
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}
.history-wrap::-webkit-scrollbar { display: none; }

.hist-item {
display: flex;
align-items: center;
gap: 12px;
padding: 14px 18px;
border-bottom: 1px solid var(–border);
min-height: 56px;
}
.hist-item:last-child { border-bottom: none; }
.hist-date {
text-align: center;
flex-shrink: 0;
width: 28px;
}
.hist-date .day {
font-family: ‘Cormorant Garamond’, serif;
font-size: 20px;
font-weight: 300;
color: var(–text2);
line-height: 1;
}
.hist-date .mon { font-size: 9px; color: var(–text3); }
.hist-icon {
width: 36px; height: 36px;
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
font-size: 16px;
flex-shrink: 0;
background: var(–surface2);
}
.hist-info { flex: 1; min-width: 0; }
.hist-cat { font-size: 13px; color: var(–text1); }
.hist-memo { font-size: 11px; color: var(–text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist-amt {
font-family: ‘Cormorant Garamond’, serif;
font-size: 20px;
font-weight: 300;
color: var(–text1);
flex-shrink: 0;
}

.empty-state {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 10px;
color: var(–text3);
padding: 32px;
}
.empty-state .ei { font-size: 36px; }
.empty-state p { font-size: 13px; text-align: center; line-height: 1.8; }

/* ===== SCREEN: SETTING ===== */
#screen-setting .content {
flex: 1;
display: flex;
flex-direction: column;
padding: 0 16px 16px;
gap: 12px;
overflow: hidden;
}
.setting-card {
background: var(–surface);
border-radius: var(–radius);
box-shadow: var(–shadow);
overflow: hidden;
flex-shrink: 0;
}
.setting-row {
display: flex;
align-items: center;
padding: 0 18px;
min-height: 58px;
border-bottom: 1px solid var(–border);
gap: 12px;
}
.setting-row:last-child { border-bottom: none; }
.setting-lbl { font-size: 14px; color: var(–text1); flex: 1; font-weight: 300; }
.setting-unit { font-size: 13px; color: var(–text3); }
.setting-input {
font-family: ‘Cormorant Garamond’, serif;
font-size: 22px;
font-weight: 300;
color: var(–primary-d);
border: none; outline: none;
background: transparent;
text-align: right;
width: 120px;
-moz-appearance: textfield;
color-scheme: light dark;
}
.setting-input::-webkit-outer-spin-button,
.setting-input::-webkit-inner-spin-button { -webkit-appearance: none; }

.free-card {
background: var(–surface2);
border: 1px solid var(–border);
border-radius: var(–radius-s);
padding: 16px 18px;
display: flex;
justify-content: space-between;
align-items: center;
flex-shrink: 0;
}
.free-card .lbl { font-size: 12px; color: var(–text2); }
.free-card .val {
font-family: ‘Cormorant Garamond’, serif;
font-size: 28px;
font-weight: 300;
color: var(–primary-d);
}

.save-btn {
width: 100%;
min-height: 52px;
background: linear-gradient(135deg, var(–primary), var(–primary-d));
border: none;
border-radius: 99px;
font-family: ‘Cormorant Garamond’, serif;
font-size: 16px;
font-weight: 300;
font-style: italic;
letter-spacing: 0.08em;
color: #fff;
cursor: pointer;
flex-shrink: 0;
transition: opacity 0.15s;
}
.save-btn:active { opacity: 0.82; }

/* ===== MODAL ===== */
.modal-overlay {
display: none;
position: fixed;
inset: 0;
background: rgba(10,25,35,0.35);
backdrop-filter: blur(15px);
-webkit-backdrop-filter: blur(15px);
z-index: 200;
align-items: flex-end;
justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal-sheet {
background: rgba(248,251,254,0.95);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border-radius: 30px 30px 0 0;
border-top: 0.5px solid var(–border);
width: 100%;
max-width: 480px;
padding: 16px 22px calc(32px + env(safe-area-inset-bottom));
animation: slideUp 0.28s cubic-bezier(0.22,1,0.36,1);
}
@keyframes slideUp {
from { transform: translateY(100%); }
to   { transform: translateY(0); }
}
.modal-handle {
width: 36px; height: 4px;
background: var(–border);
border-radius: 99px;
margin: 0 auto 18px;
}
.modal-title {
font-family: ‘Cormorant Garamond’, serif;
font-size: 20px;
font-weight: 300;
font-style: italic;
text-align: center;
color: var(–text1);
margin-bottom: 20px;
}

/* 金額入力 */
.amount-row {
display: flex;
align-items: baseline;
justify-content: center;
gap: 4px;
margin-bottom: 22px;
border-bottom: 1px solid var(–border);
padding-bottom: 12px;
transition: border-color 0.2s;
}
.amount-row:focus-within {
border-bottom: 1.5px solid var(–primary-d);
}
.amount-row .unit {
font-family: ‘Cormorant Garamond’, serif;
font-size: 26px;
color: var(–primary-d);
font-weight: 300;
}
.amount-field {
font-family: ‘Cormorant Garamond’, serif;
font-size: 52px;
font-weight: 300;
color: var(–text1);
border: none; outline: none;
background: transparent;
width: 200px;
text-align: center;
-moz-appearance: textfield;
}
.amount-field::-webkit-outer-spin-button,
.amount-field::-webkit-inner-spin-button { -webkit-appearance: none; }
.amount-field:focus ~ .amount-row { border-color: var(–primary); }

/* カテゴリチップ */
.chip-lbl { font-size: 10px; letter-spacing: 0.18em; color: var(–text3); margin-bottom: 10px; }
.chips {
display: flex; flex-wrap: wrap; gap: 8px;
margin-bottom: 18px;
}
.chip {
padding: 9px 16px;
border-radius: 99px;
border: 0.5px solid var(–border);
background: var(–surface2);
font-family: ‘Noto Sans JP’, sans-serif;
font-size: 13px;
font-weight: 300;
color: var(–text3);
cursor: pointer;
display: flex; align-items: center; gap: 5px;
min-height: 44px;
transition: all 0.15s;
}
.chip.selected {
background: var(–primary-d);
border-color: var(–primary-d);
color: #fff;
font-weight: 400;
box-shadow: 0 3px 12px rgba(74,140,170,0.3);
transform: scale(1.04);
}

/* メモ */
.memo-field {
width: 100%;
min-height: 44px;
border: none;
border-bottom: 1px solid var(–border);
border-radius: 0;
padding: 10px 4px;
font-family: ‘Noto Sans JP’, sans-serif;
font-size: 14px;
font-weight: 300;
color: var(–text1);
background: transparent;
outline: none;
margin-bottom: 20px;
color-scheme: light dark;
transition: border-color 0.2s;
}
.memo-field:focus { border-bottom-color: var(–primary-d); }
.memo-field::placeholder { color: var(–text3); }

/* ===== TOAST ===== */
.toast {
position: fixed;
bottom: calc(var(–nav-h) + 14px);
left: 50%; transform: translateX(-50%) translateY(8px);
background: var(–text1);
color: var(–bg);
padding: 10px 20px;
border-radius: 99px;
font-size: 13px;
opacity: 0;
transition: all 0.25s;
pointer-events: none;
z-index: 300;
white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

</head>
<body>
<div id="app">

  <!-- ===== HOME ===== -->

  <div id="screen-home" class="screen active">
    <div class="screen-header">
      <div class="eyebrow">Simple Budget Tracker</div>
      <h1 id="month-label">May 2026</h1>
    </div>
    <div class="content">

  <!-- バランスカード -->
  <div class="balance-card">
    <div class="lbl">今月あと使える金額</div>
    <div class="amount">
      <span class="unit">¥</span><span id="remaining-num">—</span>
    </div>
    <div class="sub" id="balance-sub">設定から月次情報を入力してください</div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="progress-row">
      <span>今月の支出</span>
      <span id="progress-pct">0%</span>
    </div>
  </div>

  <!-- 今日・今月 -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="lbl">今日の支出</div>
      <div class="amount"><span class="unit">¥</span><span id="today-num">0</span></div>
    </div>
    <div class="stat-card">
      <div class="lbl">今月の総支出</div>
      <div class="amount"><span class="unit">¥</span><span id="month-num">0</span></div>
    </div>
  </div>

  <!-- NMD -->
  <div class="nmd-bar">
    <div class="nmd-icon">🌸</div>
    <div class="nmd-text">
      <div class="lbl">No Money Day</div>
      <div class="val"><span id="nmd-num">0</span><span> 日 / 今月</span></div>
    </div>
    <div class="nmd-msg" id="nmd-msg">今月もマイペースに。</div>
  </div>

</div>

  </div>

  <!-- ===== BREAKDOWN ===== -->

  <div id="screen-breakdown" class="screen">
    <div class="screen-header">
      <div class="eyebrow">Breakdown</div>
      <h1 style="font-style:normal;font-size:22px;">カテゴリ内訳</h1>
    </div>
    <div class="content" style="padding:0 16px 16px;">
      <div class="cat-section" style="flex:1;">
        <div class="sec-title">今月のカテゴリ別</div>
        <div class="cat-rows" id="cat-rows"></div>
      </div>
      <div class="nmd-bar" style="flex-shrink:0;">
        <div class="nmd-icon">🌸</div>
        <div class="nmd-text">
          <div class="lbl">No Money Day</div>
          <div class="val"><span id="nmd-num2">0</span><span> 日 / 今月</span></div>
        </div>
        <div class="nmd-msg" id="nmd-msg2">今月もマイペースに。</div>
      </div>
    </div>
  </div>

  <!-- ===== HISTORY ===== -->

  <div id="screen-history" class="screen">
    <div class="screen-header">
      <div class="eyebrow">History</div>
      <h1 style="font-style:normal;font-size:22px;">支出履歴</h1>
    </div>
    <div class="content">
      <div class="history-wrap" id="history-wrap">
        <div class="empty-state">
          <div class="ei">🪷</div>
          <p>まだ支出がありません<br>＋から入力してね</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== SETTING ===== -->

  <div id="screen-setting" class="screen">
    <div class="screen-header">
      <div class="eyebrow">Setting</div>
      <h1 style="font-style:normal;font-size:22px;">月次設定</h1>
    </div>
    <div class="content">
      <div class="setting-card">
        <div class="setting-row">
          <span class="setting-lbl">手取り収入</span>
          <span class="setting-unit">¥</span>
          <input class="setting-input" type="number" id="s-income" placeholder="200000" inputmode="numeric">
        </div>
        <div class="setting-row">
          <span class="setting-lbl">固定費</span>
          <span class="setting-unit">¥</span>
          <input class="setting-input" type="number" id="s-fixed" placeholder="80000" inputmode="numeric">
        </div>
        <div class="setting-row">
          <span class="setting-lbl">貯金目標</span>
          <span class="setting-unit">¥</span>
          <input class="setting-input" type="number" id="s-save" placeholder="30000" inputmode="numeric">
        </div>
      </div>
      <div class="free-card">
        <span class="lbl">今月の自由費</span>
        <span class="val" id="free-val">¥ —</span>
      </div>
      <button class="save-btn" onclick="saveSettings()">保存する</button>
    </div>
  </div>

  <!-- ===== BOTTOM NAV ===== -->

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-home" onclick="switchScreen('home')">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">ホーム</span>
    </button>
    <button class="nav-btn" id="nav-breakdown" onclick="switchScreen('breakdown')">
      <span class="nav-icon">📊</span>
      <span class="nav-label">内訳</span>
    </button>
    <button class="fab" onclick="openModal()">＋</button>
    <button class="nav-btn" id="nav-history" onclick="switchScreen('history')">
      <span class="nav-icon">📋</span>
      <span class="nav-label">履歴</span>
    </button>
    <button class="nav-btn" id="nav-setting" onclick="switchScreen('setting')">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">設定</span>
    </button>
  </nav>

  <!-- MODAL -->

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div style="display:flex;align-items:center;margin-bottom:16px;">
        <button onclick="closeModal()" style="background:none;border:none;font-size:13px;color:var(--text3);cursor:pointer;padding:4px 8px 4px 0;letter-spacing:0.05em;">キャンセル</button>
        <div class="modal-title" style="flex:1;margin-bottom:0;" id="modal-title">支出を記録する</div>
        <div style="width:52px;"></div>
      </div>
      <div class="amount-row">
        <span class="unit">¥</span>
        <input class="amount-field" type="number" id="inp-amount" placeholder="0" inputmode="numeric">
      </div>
      <div class="chip-lbl">カテゴリ</div>
      <div class="chips" id="chips"></div>
      <input class="memo-field" type="text" id="inp-memo" placeholder="メモ（任意）" maxlength="30">
      <button class="save-btn" onclick="saveExpense()" id="save-btn">記録する</button>
    </div>
  </div>

  <!-- TOAST -->

  <div class="toast" id="toast"></div>

</div><!-- /app -->

<script>
const CATS = [
  { name:'食費',  icon:'🍚', bg:'#ddf0f7' },
  { name:'趣味',  icon:'🎀', bg:'#f5e9ef' },
  { name:'交通',  icon:'🚃', bg:'#e8f4e8' },
  { name:'日用品',icon:'🧴', bg:'#fdf3e3' },
  { name:'医療',  icon:'💊', bg:'#f3e8f5' },
  { name:'その他',icon:'✨', bg:'#e8eef5' },
];

let expenses = JSON.parse(localStorage.getItem('sbt_v2_exp') || '[]');
let settings = JSON.parse(localStorage.getItem('sbt_v2_set') || '{}');
let selCat = null;
let editId = null;

/* ---- init ---- */
function init() {
  buildChips();
  setMonthLabel();
  updateHome();
  updateHistory();
  loadSettings();
}

function setMonthLabel() {
  const d = new Date();
  const M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('month-label').textContent = `${M[d.getMonth()]} ${d.getFullYear()}`;
}

/* ---- home ---- */
function updateHome() {
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const td = now.toISOString().slice(0,10);

  const mExp = expenses.filter(e => e.at.startsWith(ym));
  const tExp = expenses.filter(e => e.at.startsWith(td));
  const mTotal = mExp.reduce((s,e)=>s+e.amt,0);
  const tTotal = tExp.reduce((s,e)=>s+e.amt,0);

  document.getElementById('month-num').textContent = mTotal.toLocaleString();
  document.getElementById('today-num').textContent = tTotal.toLocaleString();

  if (settings.free) {
    const rem = settings.free - mTotal;
    document.getElementById('remaining-num').textContent = rem.toLocaleString();
    const pct = Math.min(100, Math.round(mTotal / settings.free * 100));
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('balance-sub').textContent =
      rem >= 0
        ? `自由費 ¥${settings.free.toLocaleString()} のうち残り`
        : `予算を ¥${Math.abs(rem).toLocaleString()} オーバー`;
  }

  // NMD
  const days = new Set(mExp.map(e=>e.at.slice(0,10))).size;
  const elapsed = now.getDate();
  const nmd = elapsed - days;
  document.getElementById('nmd-num').textContent = nmd;
  document.getElementById('nmd-msg').textContent =
    nmd >= 10 ? '素晴らしいペース 🌸' : nmd >= 5 ? 'マイペースに ✨' : 'ほぼ毎日がんばってる 🎀';
}

/* ---- breakdown ---- */
function updateBreakdown() {
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const mExp = expenses.filter(e => e.at.startsWith(ym));

  const totals = Object.fromEntries(CATS.map(c=>[c.name,0]));
  mExp.forEach(e => { if(totals[e.cat]!==undefined) totals[e.cat]+=e.amt; });
  const maxV = Math.max(...Object.values(totals), 1);
  const rows = document.getElementById('cat-rows');
  rows.innerHTML = '';
  CATS.forEach(c => {
    const pct = Math.round(totals[c.name]/maxV*100);
    const div = document.createElement('div');
    div.className = 'cat-row';
    div.innerHTML = `
      <div class="cat-emoji">${c.icon}</div>
      <div class="cat-name">${c.name}</div>
      <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%"></div></div>
      <div class="cat-amt">¥${totals[c.name].toLocaleString()}</div>
    `;
    rows.appendChild(div);
  });

  const days = new Set(mExp.map(e=>e.at.slice(0,10))).size;
  const nmd = now.getDate() - days;
  document.getElementById('nmd-num2').textContent = nmd;
  document.getElementById('nmd-msg2').textContent =
    nmd >= 10 ? '素晴らしいペース 🌸' : nmd >= 5 ? 'マイペースに ✨' : 'ほぼ毎日がんばってる 🎀';
}

/* ---- history ---- */
function updateHistory() {
  const wrap = document.getElementById('history-wrap');
  if (!expenses.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="ei">🪷</div><p>まだ支出がありません<br>＋から入力してね</p></div>`;
    return;
  }
  const sorted = [...expenses].sort((a,b)=>new Date(b.at)-new Date(a.at));
  wrap.innerHTML = '';
  sorted.forEach((e,i) => {
    const d = new Date(e.at);
    const cat = CATS.find(c=>c.name===e.cat)||CATS[5];
    const el = document.createElement('div');
    el.className = 'hist-item';
    el.innerHTML = `
      <div class="hist-date">
        <div class="day">${d.getDate()}</div>
        <div class="mon">${d.getMonth()+1}月</div>
      </div>
      <div class="hist-icon">${cat.icon}</div>
      <div class="hist-info">
        <div class="hist-cat">${e.cat}</div>
        <div class="hist-memo">${e.memo||'　'}</div>
      </div>
      <div class="hist-amt">¥${e.amt.toLocaleString()}</div>
    `;
    // ボタンをJSで生成してイベントを確実に付与
    const btnWrap = document.createElement('div');
    btnWrap.style.cssText = 'display:flex;flex-direction:column;gap:4px;flex-shrink:0;margin-left:8px;';

    const editBtn = document.createElement('button');
    editBtn.textContent = '編集';
    editBtn.style.cssText = 'min-height:36px;padding:0 10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--primary);cursor:pointer;';
    editBtn.addEventListener('click', (ev) => { ev.stopPropagation(); openModal(expenses.find(x=>x.id===e.id)); });

    const delBtn = document.createElement('button');
    delBtn.textContent = '削除';
    delBtn.style.cssText = 'min-height:36px;padding:0 10px;background:none;border:1px solid var(--border);border-radius:8px;font-size:12px;color:var(--text3);cursor:pointer;';
    delBtn.addEventListener('click', (ev) => { ev.stopPropagation(); deleteExp(e.id); });

    btnWrap.appendChild(editBtn);
    btnWrap.appendChild(delBtn);
    el.appendChild(btnWrap);
    el.onclick = null;
    wrap.appendChild(el);
  });
}

function deleteExp(id) {
  const target = expenses.find(e => e.id === id);
  if (!target) return;
  expenses = expenses.filter(e => e.id !== id);
  persist();
  updateHome();
  updateHistory();
  updateBreakdown();
  showToast('削除しました');
}

/* ---- setting ---- */
function loadSettings() {
  if (settings.income) document.getElementById('s-income').value = settings.income;
  if (settings.fixed)  document.getElementById('s-fixed').value  = settings.fixed;
  if (settings.savings)document.getElementById('s-save').value   = settings.savings;
  calcFree();
}
['s-income','s-fixed','s-save'].forEach(id =>
  document.getElementById(id).addEventListener('input', calcFree)
);
function calcFree() {
  const inc = +document.getElementById('s-income').value||0;
  const fix = +document.getElementById('s-fixed').value||0;
  const sav = +document.getElementById('s-save').value||0;
  document.getElementById('free-val').textContent = inc ? `¥ ${(inc-fix-sav).toLocaleString()}` : '¥ —';
}
function saveSettings() {
  const inc = +document.getElementById('s-income').value||0;
  const fix = +document.getElementById('s-fixed').value||0;
  const sav = +document.getElementById('s-save').value||0;
  settings = { income:inc, fixed:fix, savings:sav, free:inc-fix-sav };
  localStorage.setItem('sbt_v2_set', JSON.stringify(settings));
  updateHome();
  showToast('設定を保存しました 🌸');
}

/* ---- modal ---- */
function buildChips() {
  const wrap = document.getElementById('chips');
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.innerHTML = `${c.icon} ${c.name}`;
    b.onclick = () => { document.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); selCat = c.name; };
    wrap.appendChild(b);
  });
}
function openModal(exp) {
  editId = exp ? exp.id : null;
  document.getElementById('modal-title').textContent = exp ? '支出を編集する' : '支出を記録する';
  document.getElementById('save-btn').textContent = exp ? '更新する' : '記録する';
  document.getElementById('inp-amount').value = exp ? exp.amt : '';
  document.getElementById('inp-memo').value = exp ? exp.memo : '';
  document.querySelectorAll('.chip').forEach(x => {
    x.classList.toggle('selected', exp && x.textContent.includes(exp.cat));
  });
  selCat = exp ? exp.cat : null;
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('inp-amount').focus(), 320);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editId = null;
}
function saveExpense() {
  const amt = +document.getElementById('inp-amount').value;
  if (!amt || amt <= 0) { showToast('金額を入力してください'); return; }
  if (!selCat)           { showToast('カテゴリを選んでください'); return; }
  const memo = document.getElementById('inp-memo').value.trim();
  if (editId) {
    const idx = expenses.findIndex(e => e.id === editId);
    if (idx !== -1) expenses[idx] = { ...expenses[idx], amt, cat: selCat, memo };
    showToast('更新しました ✨');
  } else {
    expenses.push({ id: Math.random().toString(36).slice(2), amt, cat: selCat, memo, at: new Date().toISOString() });
    showToast(`¥${amt.toLocaleString()} を記録しました ✨`);
  }
  persist();
  closeModal();
  updateHome();
  updateHistory();
  updateBreakdown();
}

/* ---- nav ---- */
function switchScreen(name) {
  ['home','breakdown','history','setting'].forEach(s => {
    document.getElementById(`screen-${s}`).classList.toggle('active', s===name);
    document.getElementById(`nav-${s}`).classList.toggle('active', s===name);
  });
  if (name === 'breakdown') updateBreakdown();
}

/* ---- utils ---- */
function persist() { localStorage.setItem('sbt_v2_exp', JSON.stringify(expenses)); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

init();
</script>

</body>
</html>
