<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Simple Budget Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --blue-pale: #ddf0f7;
    --blue-light: #b8e0ef;
    --blue-mid: #7ec8e3;
    --blue-main: #4aaece;
    --blue-deep: #2a7fa0;
    --blush: #f5e9ef;
    --blush-mid: #e8cede;
    --cream: #faf8f6;
    --text-dark: #2c3e47;
    --text-mid: #5a7585;
    --text-soft: #94b0be;
    --white: #ffffff;
    --shadow: 0 4px 24px rgba(74,174,206,0.12);
    --shadow-sm: 0 2px 12px rgba(74,174,206,0.08);
  }

- { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
font-family: ‘Zen Kaku Gothic New’, sans-serif;
background: var(–blue-pale);
color: var(–text-dark);
min-height: 100vh;
max-width: 430px;
margin: 0 auto;
position: relative;
overflow-x: hidden;
}

/* 背景装飾 */
body::before {
content: ‘’;
position: fixed;
top: -80px; right: -80px;
width: 260px; height: 260px;
background: radial-gradient(circle, rgba(184,224,239,0.5) 0%, transparent 70%);
pointer-events: none;
z-index: 0;
}
body::after {
content: ‘’;
position: fixed;
bottom: 60px; left: -60px;
width: 200px; height: 200px;
background: radial-gradient(circle, rgba(245,233,239,0.6) 0%, transparent 70%);
pointer-events: none;
z-index: 0;
}

/* ========== ヘッダー ========== */
.app-header {
padding: 52px 24px 20px;
position: relative;
z-index: 1;
}
.app-title {
font-family: ‘Cormorant Garamond’, serif;
font-size: 13px;
font-weight: 300;
letter-spacing: 0.25em;
color: var(–blue-deep);
text-transform: uppercase;
margin-bottom: 2px;
}
.app-month {
font-family: ‘Cormorant Garamond’, serif;
font-size: 28px;
font-weight: 300;
font-style: italic;
color: var(–text-dark);
letter-spacing: 0.05em;
}
.deco-line {
width: 40px; height: 1px;
background: var(–blue-mid);
margin: 10px 0 0;
}

/* ========== メインカード ========== */
.main-card {
margin: 0 16px 16px;
background: var(–white);
border-radius: 24px;
padding: 28px 24px 24px;
box-shadow: var(–shadow);
position: relative;
z-index: 1;
overflow: hidden;
}
.main-card::before {
content: ‘✦’;
position: absolute;
top: 18px; right: 22px;
font-size: 10px;
color: var(–blue-light);
letter-spacing: 6px;
}
.balance-label {
font-size: 11px;
letter-spacing: 0.18em;
color: var(–text-soft);
font-weight: 300;
margin-bottom: 6px;
}
.balance-amount {
font-family: ‘Cormorant Garamond’, serif;
font-size: 52px;
font-weight: 300;
color: var(–blue-deep);
line-height: 1;
letter-spacing: -0.01em;
}
.balance-amount span {
font-size: 22px;
vertical-align: super;
margin-right: 2px;
color: var(–blue-main);
}
.balance-sub {
font-size: 11px;
color: var(–text-soft);
margin-top: 8px;
font-weight: 300;
font-style: italic;
}

/* プログレスバー */
.progress-wrap {
margin-top: 20px;
}
.progress-bar-bg {
height: 6px;
background: var(–blue-pale);
border-radius: 99px;
overflow: hidden;
}
.progress-bar-fill {
height: 100%;
background: linear-gradient(90deg, var(–blue-light), var(–blue-main));
border-radius: 99px;
width: 57%;
transition: width 1s ease;
}
.progress-labels {
display: flex;
justify-content: space-between;
margin-top: 6px;
font-size: 10px;
color: var(–text-soft);
font-weight: 300;
}

/* ========== 今日の支出・今月合計 ========== */
.stats-row {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
margin: 0 16px 16px;
position: relative;
z-index: 1;
}
.stat-card {
background: var(–white);
border-radius: 18px;
padding: 18px 16px;
box-shadow: var(–shadow-sm);
}
.stat-label {
font-size: 10px;
letter-spacing: 0.15em;
color: var(–text-soft);
font-weight: 300;
margin-bottom: 6px;
}
.stat-amount {
font-family: ‘Cormorant Garamond’, serif;
font-size: 26px;
font-weight: 300;
color: var(–text-dark);
line-height: 1;
}
.stat-amount small {
font-size: 13px;
color: var(–text-soft);
}
.stat-note {
font-size: 10px;
color: var(–blue-main);
margin-top: 4px;
font-weight: 300;
}

/* ========== カテゴリ別 ========== */
.section {
margin: 0 16px 16px;
position: relative;
z-index: 1;
}
.section-title {
font-size: 10px;
letter-spacing: 0.2em;
color: var(–text-soft);
font-weight: 300;
text-transform: uppercase;
margin-bottom: 12px;
display: flex;
align-items: center;
gap: 10px;
}
.section-title::after {
content: ‘’;
flex: 1;
height: 1px;
background: var(–blue-light);
}

.category-list {
background: var(–white);
border-radius: 18px;
overflow: hidden;
box-shadow: var(–shadow-sm);
}
.cat-item {
padding: 14px 18px;
display: flex;
align-items: center;
gap: 12px;
border-bottom: 1px solid var(–blue-pale);
}
.cat-item:last-child { border-bottom: none; }
.cat-icon {
width: 34px; height: 34px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 15px;
flex-shrink: 0;
}
.cat-name {
font-size: 13px;
font-weight: 300;
color: var(–text-dark);
flex: 1;
}
.cat-bar-wrap {
width: 60px;
height: 3px;
background: var(–blue-pale);
border-radius: 99px;
overflow: hidden;
flex-shrink: 0;
}
.cat-bar {
height: 100%;
border-radius: 99px;
background: linear-gradient(90deg, var(–blue-light), var(–blue-mid));
}
.cat-amount {
font-family: ‘Cormorant Garamond’, serif;
font-size: 17px;
font-weight: 300;
color: var(–text-mid);
text-align: right;
min-width: 68px;
}

/* no money day */
.nmd-card {
background: linear-gradient(135deg, var(–blush) 0%, var(–blue-pale) 100%);
border-radius: 18px;
padding: 16px 20px;
display: flex;
align-items: center;
gap: 14px;
box-shadow: var(–shadow-sm);
margin: 0 16px 16px;
position: relative;
z-index: 1;
}
.nmd-icon {
font-size: 28px;
flex-shrink: 0;
}
.nmd-label {
font-size: 10px;
letter-spacing: 0.15em;
color: var(–text-soft);
font-weight: 300;
margin-bottom: 2px;
}
.nmd-count {
font-family: ‘Cormorant Garamond’, serif;
font-size: 28px;
font-weight: 300;
color: var(–text-dark);
line-height: 1;
}
.nmd-count span {
font-size: 13px;
color: var(–text-soft);
font-family: ‘Zen Kaku Gothic New’, sans-serif;
font-weight: 300;
}
.nmd-msg {
font-size: 11px;
color: var(–blue-deep);
font-style: italic;
font-family: ‘Cormorant Garamond’, serif;
margin-top: 2px;
}

/* ========== 入力フォーム（モーダル） ========== */
.fab {
position: fixed;
bottom: 88px;
right: 24px;
width: 58px; height: 58px;
background: linear-gradient(135deg, var(–blue-mid), var(–blue-deep));
border-radius: 50%;
border: none;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 26px;
color: white;
box-shadow: 0 6px 24px rgba(42,127,160,0.35);
z-index: 100;
transition: transform 0.2s ease;
line-height: 1;
}
.fab:active { transform: scale(0.94); }

.modal-overlay {
display: none;
position: fixed;
inset: 0;
background: rgba(44, 62, 71, 0.3);
backdrop-filter: blur(4px);
z-index: 200;
align-items: flex-end;
}
.modal-overlay.open { display: flex; }

.modal-sheet {
background: var(–white);
border-radius: 28px 28px 0 0;
width: 100%;
max-width: 430px;
margin: 0 auto;
padding: 20px 24px 40px;
animation: slideUp 0.3s cubic-bezier(0.22,1,0.36,1);
}
@keyframes slideUp {
from { transform: translateY(100%); }
to { transform: translateY(0); }
}
.modal-handle {
width: 36px; height: 4px;
background: var(–blue-light);
border-radius: 99px;
margin: 0 auto 20px;
}
.modal-title {
font-family: ‘Cormorant Garamond’, serif;
font-size: 22px;
font-weight: 300;
font-style: italic;
color: var(–text-dark);
margin-bottom: 24px;
text-align: center;
}

.amount-input-wrap {
text-align: center;
margin-bottom: 24px;
}
.yen-prefix {
font-family: ‘Cormorant Garamond’, serif;
font-size: 28px;
color: var(–blue-main);
font-weight: 300;
}
.amount-input {
font-family: ‘Cormorant Garamond’, serif;
font-size: 52px;
font-weight: 300;
color: var(–text-dark);
border: none;
outline: none;
width: 200px;
text-align: center;
background: transparent;
border-bottom: 2px solid var(–blue-light);
padding-bottom: 4px;
-moz-appearance: textfield;
}
.amount-input::-webkit-outer-spin-button,
.amount-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.amount-input:focus { border-bottom-color: var(–blue-main); }

.cat-select-label {
font-size: 10px;
letter-spacing: 0.18em;
color: var(–text-soft);
font-weight: 300;
margin-bottom: 10px;
}
.cat-chips {
display: flex;
flex-wrap: wrap;
gap: 8px;
margin-bottom: 20px;
}
.cat-chip {
padding: 8px 16px;
border-radius: 99px;
border: 1.5px solid var(–blue-light);
background: transparent;
font-family: ‘Zen Kaku Gothic New’, sans-serif;
font-size: 13px;
font-weight: 300;
color: var(–text-mid);
cursor: pointer;
transition: all 0.15s;
display: flex;
align-items: center;
gap: 5px;
}
.cat-chip.selected {
background: var(–blue-pale);
border-color: var(–blue-main);
color: var(–blue-deep);
}

.memo-input {
width: 100%;
border: 1.5px solid var(–blue-light);
border-radius: 12px;
padding: 12px 16px;
font-family: ‘Zen Kaku Gothic New’, sans-serif;
font-size: 14px;
font-weight: 300;
color: var(–text-dark);
background: var(–cream);
outline: none;
margin-bottom: 20px;
}
.memo-input::placeholder { color: var(–text-soft); }
.memo-input:focus { border-color: var(–blue-main); }

.save-btn {
width: 100%;
padding: 16px;
background: linear-gradient(135deg, var(–blue-mid), var(–blue-deep));
border: none;
border-radius: 16px;
font-family: ‘Zen Kaku Gothic New’, sans-serif;
font-size: 15px;
font-weight: 300;
color: white;
letter-spacing: 0.12em;
cursor: pointer;
transition: opacity 0.15s;
}
.save-btn:active { opacity: 0.85; }

/* ========== ボトムナビ ========== */
.bottom-nav {
position: fixed;
bottom: 0; left: 50%;
transform: translateX(-50%);
width: 100%;
max-width: 430px;
background: var(–white);
border-top: 1px solid var(–blue-pale);
display: flex;
z-index: 50;
padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
padding: 10px 0 8px;
cursor: pointer;
gap: 3px;
border: none;
background: none;
transition: opacity 0.15s;
}
.nav-item:active { opacity: 0.7; }
.nav-icon { font-size: 20px; line-height: 1; }
.nav-label {
font-size: 9px;
letter-spacing: 0.1em;
color: var(–text-soft);
font-weight: 300;
}
.nav-item.active .nav-icon { filter: none; }
.nav-item.active .nav-label { color: var(–blue-deep); }
.nav-dot {
width: 4px; height: 4px;
border-radius: 50%;
background: var(–blue-main);
margin: 0 auto;
}

/* ========== 履歴画面 ========== */
.screen { display: none; padding-bottom: 90px; }
.screen.active { display: block; }

.history-list {
background: var(–white);
border-radius: 18px;
overflow: hidden;
box-shadow: var(–shadow-sm);
}
.history-item {
display: flex;
align-items: center;
gap: 12px;
padding: 14px 18px;
border-bottom: 1px solid var(–blue-pale);
cursor: pointer;
transition: background 0.15s;
}
.history-item:last-child { border-bottom: none; }
.history-item:active { background: var(–blue-pale); }
.hist-date {
font-size: 11px;
color: var(–text-soft);
font-weight: 300;
min-width: 28px;
text-align: center;
line-height: 1.3;
}
.hist-date strong {
display: block;
font-size: 18px;
font-family: ‘Cormorant Garamond’, serif;
color: var(–text-mid);
font-weight: 300;
}
.hist-icon {
width: 36px; height: 36px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 16px;
flex-shrink: 0;
}
.hist-info { flex: 1; min-width: 0; }
.hist-cat {
font-size: 12px;
font-weight: 300;
color: var(–text-mid);
}
.hist-memo {
font-size: 11px;
color: var(–text-soft);
font-weight: 300;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.hist-amount {
font-family: ‘Cormorant Garamond’, serif;
font-size: 20px;
font-weight: 300;
color: var(–text-dark);
flex-shrink: 0;
}

/* ========== 設定画面 ========== */
.setting-card {
background: var(–white);
border-radius: 18px;
overflow: hidden;
box-shadow: var(–shadow-sm);
}
.setting-row {
display: flex;
align-items: center;
padding: 16px 18px;
border-bottom: 1px solid var(–blue-pale);
gap: 12px;
}
.setting-row:last-child { border-bottom: none; }
.setting-label {
font-size: 13px;
font-weight: 300;
color: var(–text-dark);
flex: 1;
}
.setting-input {
font-family: ‘Cormorant Garamond’, serif;
font-size: 20px;
font-weight: 300;
color: var(–blue-deep);
border: none;
outline: none;
background: transparent;
text-align: right;
width: 130px;
-moz-appearance: textfield;
}
.setting-input::-webkit-outer-spin-button,
.setting-input::-webkit-inner-spin-button { -webkit-appearance: none; }

.calc-result {
background: var(–blue-pale);
border-radius: 14px;
padding: 16px 18px;
margin-top: 14px;
display: flex;
justify-content: space-between;
align-items: center;
}
.calc-label {
font-size: 12px;
font-weight: 300;
color: var(–text-mid);
}
.calc-amount {
font-family: ‘Cormorant Garamond’, serif;
font-size: 28px;
font-weight: 300;
color: var(–blue-deep);
}

.toast {
position: fixed;
bottom: 100px;
left: 50%; transform: translateX(-50%) translateY(20px);
background: var(–text-dark);
color: white;
padding: 10px 22px;
border-radius: 99px;
font-size: 13px;
font-weight: 300;
opacity: 0;
transition: all 0.3s;
pointer-events: none;
z-index: 300;
white-space: nowrap;
}
.toast.show {
opacity: 1;
transform: translateX(-50%) translateY(0);
}

/* 初回設定案内 */
.empty-state {
text-align: center;
padding: 40px 20px;
color: var(–text-soft);
}
.empty-state .es-icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 13px; font-weight: 300; line-height: 1.8; }
</style>

</head>

<!-- ========== ホーム画面 ========== -->

<div id="screen-home" class="screen active">
  <div class="app-header">
    <div class="app-title">Simple Budget Tracker</div>
    <div class="app-month" id="current-month-label">May 2026</div>
    <div class="deco-line"></div>
  </div>

  <!-- メインカード -->

  <div class="main-card">
    <div class="balance-label">今月あと使える金額</div>
    <div class="balance-amount" id="remaining-display">
      <span>¥</span><span id="remaining-num">—</span>
    </div>
    <div class="balance-sub" id="balance-sub-text">設定から月次情報を入力してください</div>
    <div class="progress-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <div class="progress-labels">
        <span>支出</span>
        <span id="progress-pct">0%</span>
      </div>
    </div>
  </div>

  <!-- 今日・今月 -->

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">今日の支出</div>
      <div class="stat-amount"><small>¥</small><span id="today-display">0</span></div>
      <div class="stat-note" id="today-note">　</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">今月の総支出</div>
      <div class="stat-amount"><small>¥</small><span id="month-display">0</span></div>
      <div class="stat-note" id="month-note">　</div>
    </div>
  </div>

  <!-- カテゴリ別 -->

  <div class="section">

    <div class="category-list" id="cat-list">

    </div>

  <!-- ノーマネーデー -->

      <div class="nmd-count"><span id="nmd-count">0</span> <span>日 / 今月</span></div>
      <div class="nmd-msg" id="nmd-msg">今月もマイペースに。</div>
    </div>
  </div>
</div>

<!-- ========== 履歴画面 ========== -->

<div id="screen-history" class="screen">
  <div class="app-header">
    <div class="app-title">History</div>
    <div class="app-month" style="font-style:normal;font-size:20px;">支出履歴</div>
    <div class="deco-line"></div>
  </div>
  <div class="section" style="margin-top:0">
    <div class="history-list" id="history-list">
      <div class="empty-state">
        <div class="es-icon">🪷</div>
        <p>まだ支出がありません<br>右下の＋から入力してね</p>
      </div>
    </div>
  </div>
</div>

<!-- ========== 設定画面 ========== -->

<div id="screen-setting" class="screen">
  <div class="app-header">
    <div class="app-title">Setting</div>
    <div class="app-month" style="font-style:normal;font-size:20px;">月次設定</div>
    <div class="deco-line"></div>
  </div>
  <div class="section" style="margin-top:0">
    <div class="section-title">今月の基本情報</div>
    <div class="setting-card">
      <div class="setting-row">
        <div class="setting-label">手取り収入</div>
        <span style="color:var(--text-soft);font-size:13px">¥</span>
        <input class="setting-input" type="number" id="s-income" placeholder="200000" inputmode="numeric">
      </div>
      <div class="setting-row">
        <div class="setting-label">固定費</div>
        <span style="color:var(--text-soft);font-size:13px">¥</span>
        <input class="setting-input" type="number" id="s-fixed" placeholder="80000" inputmode="numeric">
      </div>
      <div class="setting-row">
        <div class="setting-label">貯金目標</div>
        <span style="color:var(--text-soft);font-size:13px">¥</span>
        <input class="setting-input" type="number" id="s-save" placeholder="30000" inputmode="numeric">
      </div>
    </div>
    <div class="calc-result">
      <div class="calc-label">今月の自由費</div>
      <div class="calc-amount" id="free-amount">¥ —</div>
    </div>
    <button class="save-btn" style="margin-top:16px" onclick="saveSettings()">保存する</button>
  </div>
</div>

<!-- FAB -->

<button class="fab" id="fab-btn" onclick="openModal()">＋</button>

<!-- ボトムナビ -->

<nav class="bottom-nav">
  <button class="nav-item active" id="nav-home" onclick="switchScreen('home')">
    <span class="nav-icon">🏠</span>
    <div class="nav-dot"></div>
    <span class="nav-label">ホーム</span>
  </button>

  </button>
  <button class="nav-item" id="nav-setting" onclick="switchScreen('setting')">
    <span class="nav-icon">⚙️</span>
    <div class="nav-dot" style="opacity:0"></div>
    <span class="nav-label">設定</span>
  </button>
</nav>

<!-- 入力モーダル -->

<div class="modal-overlay" id="modal-overlay" onclick="closeOnOverlay(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">支出を記録する</div>

</div>

<!-- トースト -->

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = [
  { name: '食費',  icon: '🍚', color: '#ddf0f7' },
  { name: '趣味',  icon: '🎀', color: '#f5e9ef' },
  { name: '交通',  icon: '🚃', color: '#e8f4e8' },
  { name: '日用品', icon: '🧴', color: '#fdf3e3' },
  { name: '医療',  icon: '💊', color: '#f3e8f5' },
  { name: 'その他', icon: '✨', color: '#e8eef5' },
];

let selectedCat = null;
let expenses = JSON.parse(localStorage.getItem('sbt_expenses') || '[]');
let settings = JSON.parse(localStorage.getItem('sbt_settings') || '{}');

// ========== 初期化 ==========
function init() {
  buildCatChips();
  buildCatList();
  updateMonthLabel();
  updateHome();
  updateHistory();
  loadSettings();
  updateFreeAmount();
}

function updateMonthLabel() {
  const d = new Date();
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('current-month-label').textContent = `${months[d.getMonth()]} ${d.getFullYear()}`;
}

// ========== カテゴリチップ（モーダル用） ==========
function buildCatChips() {
  const wrap = document.getElementById('cat-chips');
  wrap.innerHTML = '';
  CATEGORIES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-chip';
    btn.innerHTML = `${c.icon} ${c.name}`;
    btn.onclick = () => selectCat(c.name, btn);
    wrap.appendChild(btn);
  });
}

function selectCat(name, el) {
  document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedCat = name;
}

// ========== ホーム更新 ==========
function updateHome() {
  const now = new Date();
  const thisMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const today = now.toISOString().slice(0,10);

  const monthExp = expenses.filter(e => e.created_at.startsWith(thisMonth));
  const todayExp = expenses.filter(e => e.created_at.startsWith(today));

  const totalMonth = monthExp.reduce((s,e) => s + e.amount, 0);
  const totalToday = todayExp.reduce((s,e) => s + e.amount, 0);

  document.getElementById('month-display').textContent = totalMonth.toLocaleString();
  document.getElementById('today-display').textContent = totalToday.toLocaleString();

  // 残高
  if (settings.free) {
    const remaining = settings.free - totalMonth;
    document.getElementById('remaining-num').textContent = remaining.toLocaleString();
    const pct = Math.min(100, Math.round(totalMonth / settings.free * 100));
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('balance-sub-text').textContent =
      remaining >= 0
        ? `自由費 ¥${settings.free.toLocaleString()} のうち残り`
        : `予算オーバー（¥${Math.abs(remaining).toLocaleString()}）`;
    document.getElementById('month-note').textContent = `自由費の${pct}%`;
  }

  // カテゴリ別
  buildCatList(monthExp);

  // ノーマネーデー
  const daysInMonth = new Set(monthExp.map(e => e.created_at.slice(0,10)));
  const daysElapsed = now.getDate();
  const nmd = daysElapsed - daysInMonth.size;
  document.getElementById('nmd-count').textContent = nmd;
  const msgs = ['マイペースに続けましょう ✨', '素晴らしいペースです 🌸', 'よくがんばってます 🎀'];
  document.getElementById('nmd-msg').textContent = nmd >= 10 ? msgs[1] : nmd >= 5 ? msgs[0] : msgs[2];
}

function buildCatList(monthExp) {
  if (!monthExp) {
    const now = new Date();
    const thisMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    monthExp = expenses.filter(e => e.created_at.startsWith(thisMonth));
  }
  const totals = {};
  CATEGORIES.forEach(c => totals[c.name] = 0);
  monthExp.forEach(e => { if (totals[e.category] !== undefined) totals[e.category] += e.amount; });
  const maxVal = Math.max(...Object.values(totals), 1);

  const list = document.getElementById('cat-list');
  list.innerHTML = '';
  CATEGORIES.forEach(c => {
    const amt = totals[c.name];
    const pct = Math.round(amt / maxVal * 100);
    const item = document.createElement('div');
    item.className = 'cat-item';
    item.innerHTML = `
      <div class="cat-icon" style="background:${c.color}">${c.icon}</div>
      <div class="cat-name">${c.name}</div>
      <div class="cat-bar-wrap"><div class="cat-bar" style="width:${pct}%"></div></div>
      <div class="cat-amount">¥${amt.toLocaleString()}</div>
    `;
    list.appendChild(item);
  });
}

// ========== 履歴 ==========
function updateHistory() {
  const list = document.getElementById('history-list');
  if (expenses.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="es-icon">🪷</div><p>まだ支出がありません<br>右下の＋から入力してね</p></div>`;
    return;
  }
  const sorted = [...expenses].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  list.innerHTML = '';
  sorted.forEach((e, idx) => {
    const d = new Date(e.created_at);
    const cat = CATEGORIES.find(c => c.name === e.category) || CATEGORIES[5];
    const item = document.createElement('div');
    item.className = 'history-item';
    item.innerHTML = `
      <div class="hist-date"><strong>${d.getDate()}</strong>${d.getMonth()+1}月</div>
      <div class="hist-icon" style="background:${cat.color}">${cat.icon}</div>
      <div class="hist-info">
        <div class="hist-cat">${e.category}</div>
        <div class="hist-memo">${e.memo || '　'}</div>
      </div>
      <div class="hist-amount">¥${e.amount.toLocaleString()}</div>
    `;
    item.onclick = () => deleteExpense(idx, sorted);
    list.appendChild(item);
  });
}

function deleteExpense(sortedIdx, sorted) {
  const target = sorted[sortedIdx];
  if (!confirm(`この記録を削除しますか？\n${target.category} ¥${target.amount.toLocaleString()}`)) return;
  expenses = expenses.filter(e => e !== target);
  save();
  updateHome();
  updateHistory();
  showToast('削除しました');
}

// ========== 設定 ==========
function loadSettings() {
  if (settings.income) document.getElementById('s-income').value = settings.income;
  if (settings.fixed) document.getElementById('s-fixed').value = settings.fixed;
  if (settings.savings) document.getElementById('s-save').value = settings.savings;
  updateFreeAmount();
}

['s-income','s-fixed','s-save'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateFreeAmount);
});

function updateFreeAmount() {
  const inc = +document.getElementById('s-income').value || 0;
  const fix = +document.getElementById('s-fixed').value || 0;
  const sav = +document.getElementById('s-save').value || 0;
  const free = inc - fix - sav;
  document.getElementById('free-amount').textContent = inc ? `¥ ${free.toLocaleString()}` : '¥ —';
}

function saveSettings() {
  const inc = +document.getElementById('s-income').value || 0;
  const fix = +document.getElementById('s-fixed').value || 0;
  const sav = +document.getElementById('s-save').value || 0;
  settings = { income: inc, fixed: fix, savings: sav, free: inc - fix - sav };
  localStorage.setItem('sbt_settings', JSON.stringify(settings));
  updateHome();
  showToast('設定を保存しました 🌸');
}

// ========== 支出入力 ==========
function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('input-amount').value = '';
  document.getElementById('input-memo').value = '';
  document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('selected'));
  selectedCat = null;
  setTimeout(() => document.getElementById('input-amount').focus(), 300);
}

function closeOnOverlay(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function saveExpense() {
  const amt = +document.getElementById('input-amount').value;
  if (!amt || amt <= 0) { showToast('金額を入力してください'); return; }
  if (!selectedCat) { showToast('カテゴリを選んでください'); return; }
  const memo = document.getElementById('input-memo').value.trim();
  const exp = {
    id: crypto.randomUUID(),
    amount: amt,
    category: selectedCat,
    memo: memo,
    created_at: new Date().toISOString()
  };
  expenses.push(exp);
  save();
  closeModal();
  updateHome();
  updateHistory();
  showToast(`¥${amt.toLocaleString()} を記録しました ✨`);
}

function save() {
  localStorage.setItem('sbt_expenses', JSON.stringify(expenses));
}

// ========== ナビ ==========
function switchScreen(name) {
  ['home','history','setting'].forEach(s => {
    document.getElementById(`screen-${s}`).classList.toggle('active', s === name);
    const nav = document.getElementById(`nav-${s}`);
    nav.classList.toggle('active', s === name);
    nav.querySelector('.nav-dot').style.opacity = s === name ? '1' : '0';
  });
}

// ========== トースト ==========
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

init();
</script>

</body>
</html>
